name: build-kernel

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'defconfig name'
        required: true
        default: 'oppo6765_defconfig'
      modules_ref:
        description: 'OPPO kernel modules repo branch'
        required: true
        default: 'oppo/mt6765_r_11.1.4_a16'
      extra_kernel_repo:
        description: 'helper kernel repo donating fs/exfat + fs/sdcardfs'
        required: true
        default: 'oppo-source/android_kernel_oppo_mt6779'
  push:
    branches:
      - 'oppo/**'
    paths:
      - '.github/workflows/build-kernel.yml'

concurrency:
  group: build-kernel-${{ github.ref }}
  cancel-in-progress: true

env:
  MAKE_ARGS: >-
    ARCH=arm64
    CC=clang
    LD=ld.lld
    NM=llvm-nm
    OBJCOPY=llvm-objcopy
    OBJDUMP=llvm-objdump
    STRIP=llvm-strip
    AR=llvm-ar
    CLANG_TRIPLE=aarch64-linux-gnu-
    CROSS_COMPILE=aarch64-linux-androidkernel-
    CROSS_COMPILE_ARM32=arm-linux-androideabi-

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: kernel

      - name: Checkout OPPO vendor modules
        uses: actions/checkout@v4
        with:
          repository: oppo-source/android_kernel_modules_oppo_mt6765
          ref: ${{ github.event.inputs.modules_ref || 'oppo/mt6765_r_11.1.4_a16' }}
          fetch-depth: 1
          path: modules

      - name: Checkout helper kernel for fs modules
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.extra_kernel_repo || 'oppo-source/android_kernel_oppo_mt6779' }}
          fetch-depth: 1
          path: helper

      - name: Assemble source tree
        run: |
          set -euo pipefail
          cp -a modules/source/vendor ./vendor
          rm -rf modules
          mkdir -p android
          ln -sfn ../vendor android/vendor

          test -f helper/fs/exfat/Kconfig
          test -f helper/fs/sdcardfs/Makefile

          rm -rf kernel/fs/exfat kernel/fs/osdcardfs kernel/fs/sdcardfs
          cp -a helper/fs/exfat kernel/fs/exfat
          cp -a helper/fs/sdcardfs kernel/fs/sdcardfs
          cp -a helper/fs/sdcardfs kernel/fs/osdcardfs
          rm -rf helper

          cd kernel
          ln -sfn ../../oplus/kernel/oplus_performance/gloom/resmap_account.h fs/proc/resmap_account.h
          ln -sfn ../vendor/oplus/kernel/oplus_performance/vm_anti_fragment/vm_anti_fragment.c mm/vm_anti_fragment1.c

          echo "---- dangling symlinks ----"
          find . -xtype l | sort || true

          SECCOM=vendor/oplus/secure/common/bsp/drivers/oppo_secure_common/oppo_secure_common.c
          if [ -f "$SECCOM" ]; then
            sed -i 's/#if CONFIG_OPPO_BSP_SECCOM_PLATFORM == 6763/#if 1 || CONFIG_OPPO_BSP_SECCOM_PLATFORM == 6763/' "$SECCOM"
            grep -n 'CONFIG_OPPO_BSP_SECCOM_PLATFORM' "$SECCOM" | head -5
          fi

      - name: Install host dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio flex git libelf-dev \
            libssl-dev openssl python3 rsync xz-utils zip

      - name: Restore toolchain cache
        id: tccache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/tc/clang
            ${{ runner.temp }}/tc/gcc64
            ${{ runner.temp }}/tc/gcc32
          key: tc-clang-r383902-gcc49-lineage19.1-v3

      - name: Download toolchains
        if: steps.tccache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tc"
          cd "$RUNNER_TEMP/tc"
          git clone --depth=1 https://github.com/afaneh-toolchain/prebuilts_clang_host_linux-x86_clang-r383902.git clang
          git clone --depth=1 -b lineage-19.1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc64
          git clone --depth=1 -b lineage-19.1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc32
          rm -rf clang/.git gcc64/.git gcc32/.git

      - name: Register aarch64-linux-gnu aliases
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/tc/gcc64/bin"
          for t in as ld nm objcopy objdump readelf strip ar cpp; do
            if [ -e "aarch64-linux-android-$t" ]; then
              ln -sf "aarch64-linux-android-$t" "aarch64-linux-gnu-$t"
            fi
          done
          echo "$RUNNER_TEMP/tc/clang/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/tc/gcc64/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/tc/gcc32/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: |
          set -euo pipefail
          clang --version
          ld.lld --version
          aarch64-linux-gnu-as --version | head -1
          aarch64-linux-gnu-ld --version | head -1
          arm-linux-androideabi-as --version | head -1

      - name: Configure kernel
        working-directory: kernel
        run: |
          set -euo pipefail
          DEFCONFIG="${{ github.event.inputs.defconfig }}"
          if [ -z "$DEFCONFIG" ]; then DEFCONFIG="oppo6765_defconfig"; fi
          make O=out $MAKE_ARGS "$DEFCONFIG"
          grep -E '^CONFIG_(BUILD_ARM64|MTK_PLATFORM|ARCH_MTK_PROJECT|EXFAT)' out/.config || true

      - name: Build kernel image
        working-directory: kernel
        run: |
          set -euo pipefail
          make O=out $MAKE_ARGS -j"$(nproc)" Image.gz
          ls -lh out/arch/arm64/boot/Image.gz out/arch/arm64/boot/Image

      - name: Build device trees
        working-directory: kernel
        run: |
          set -euo pipefail
          make O=out $MAKE_ARGS -j"$(nproc)" dtbs
          find out/arch/arm64/boot/dts -name '*.dtb' | sort | head -40

      - name: Show kernel release
        working-directory: kernel
        run: cat out/include/config/kernel.release || true

      - name: Package artifacts
        working-directory: kernel
        run: |
          set -euo pipefail
          mkdir -p ../dist
          cp out/arch/arm64/boot/Image.gz ../dist/Image.gz
          cp out/arch/arm64/boot/Image ../dist/Image
          cp out/.config ../dist/kernel.config
          cp out/include/config/kernel.release ../dist/kernel.release
          find out/arch/arm64/boot/dts -name '*.dtb' -exec cp {} ../dist/ \;
          find out/arch/arm64/boot/dts -name '*.dtbo' -exec cp {} ../dist/ \; || true
          ls -lh ../dist

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-mt6765-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error

      - name: Upload vmlinux
        uses: actions/upload-artifact@v4
        with:
          name: vmlinux-mt6765-${{ github.run_number }}
          path: kernel/out/vmlinux
          if-no-files-found: warn