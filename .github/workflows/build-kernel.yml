name: build-kernel

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'defconfig name'
        required: true
        default: 'oppo6765_defconfig'
  push:
    branches:
      - 'oppo/**'
    paths:
      - '.github/workflows/build-kernel.yml'

concurrency:
  group: build-kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install host dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio flex git libelf-dev \
            libssl-dev openssl python3 rsync xz-utils zip

      - name: Restore toolchain cache
        id: tccache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/tc/clang
            ${{ runner.temp }}/tc/gcc64
            ${{ runner.temp }}/tc/gcc32
          key: tc-clang-r383902-gcc49-lineage19.1-v2

      - name: Download toolchains
        if: steps.tccache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tc"
          cd "$RUNNER_TEMP/tc"
          git clone --depth=1 https://github.com/afaneh-toolchain/prebuilts_clang_host_linux-x86_clang-r383902.git clang
          git clone --depth=1 -b lineage-19.1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc64
          git clone --depth=1 -b lineage-19.1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc32
          rm -rf clang/.git gcc64/.git gcc32/.git

      - name: Register cross compiler aliases
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/tc"
          chmod -R u+w gcc64 gcc32 clang || true
          for f in gcc64/bin/aarch64-linux-android-*; do
            [ -f "$f" ] || continue
            [ -L "$f" ] && continue
            base="$(basename "$f")"
            suffix="${base#aarch64-linux-android-}"
            ln -sf "$base" "gcc64/bin/aarch64-linux-androidkernel-$suffix"
            ln -sf "$base" "gcc64/bin/aarch64-linux-gnu-$suffix"
          done
          echo "$RUNNER_TEMP/tc/clang/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/tc/gcc64/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/tc/gcc32/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: |
          set -euo pipefail
          clang --version
          ld.lld --version
          aarch64-linux-androidkernel-elfedit --version | head -1
          aarch64-linux-gnu-as --version | head -1
          aarch64-linux-gnu-ld --version | head -1
          arm-linux-androideabi-as --version | head -1

      - name: Configure kernel
        run: |
          set -euo pipefail
          DEFCONFIG="${{ github.event.inputs.defconfig }}"
          if [ -z "$DEFCONFIG" ]; then DEFCONFIG="oppo6765_defconfig"; fi
          echo "DEFCONFIG=$DEFCONFIG" >> "$GITHUB_ENV"
          make O=out ARCH=arm64 \
            CC=clang LD=ld.lld NM=llvm-nm OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump STRIP=llvm-strip AR=llvm-ar \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-androidkernel- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            "$DEFCONFIG"
          grep -E '^CONFIG_(LOCALVERSION|MODULE_SIG|BUILD_ARM64|MTK_PLATFORM|ARCH_MTK_PROJECT|CC_IS)' out/.config || true

      - name: Build device trees
        run: |
          set -euo pipefail
          make O=out ARCH=arm64 \
            CC=clang LD=ld.lld NM=llvm-nm OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump STRIP=llvm-strip AR=llvm-ar \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-androidkernel- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            -j"$(nproc)" dtbs
          find out/arch/arm64/boot/dts -name '*.dtb' | sort

      - name: Build kernel image
        run: |
          set -euo pipefail
          make O=out ARCH=arm64 \
            CC=clang LD=ld.lld NM=llvm-nm OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump STRIP=llvm-strip AR=llvm-ar \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-androidkernel- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            -j"$(nproc)" Image.gz
          ls -lh out/arch/arm64/boot/Image.gz out/arch/arm64/boot/Image

      - name: Show kernel version
        run: |
          set -euo pipefail
          cat out/include/config/kernel.release || true

      - name: Package artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          cp out/arch/arm64/boot/Image.gz dist/Image.gz
          cp out/arch/arm64/boot/Image dist/Image || true
          cp out/.config dist/kernel.config || true
          cat out/include/config/kernel.release > dist/kernel.release 2>/dev/null || true
          find out/arch/arm64/boot/dts -name '*.dtb' -exec cp {} dist/ \;
          ls -lh dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-mt6765-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error

      - name: Upload vmlinux
        uses: actions/upload-artifact@v4
        with:
          name: vmlinux-mt6765-${{ github.run_number }}
          path: out/vmlinux
          if-no-files-found: warn